# sarek 3.10.0 WGS-mode parameters for the x86 cloud reference runs (paths under /data/omics).
input: samplesheet.csv
outdir: results
igenomes_ignore: true
fasta: /data/omics/ref/GATK.GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.fasta
fasta_fai: /data/omics/ref/GATK.GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.fasta.fai
dict: /data/omics/ref/GATK.GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.dict
bwa: /data/omics/ref/GATK.GRCh38/Sequence/BWAIndex/
dbsnp: /data/omics/ref/GATK.GRCh38/Annotation/GATKBundle/dbsnp_146.hg38.vcf.gz
dbsnp_tbi: /data/omics/ref/GATK.GRCh38/Annotation/GATKBundle/dbsnp_146.hg38.vcf.gz.tbi
known_indels: /data/omics/ref/GATK.GRCh38/Annotation/GATKBundle/{Mills_and_1000G_gold_standard.indels.hg38,beta/Homo_sapiens_assembly38.known_indels}.vcf.gz
known_indels_tbi: /data/omics/ref/GATK.GRCh38/Annotation/GATKBundle/{Mills_and_1000G_gold_standard.indels.hg38,beta/Homo_sapiens_assembly38.known_indels}.vcf.gz.tbi
intervals: /data/omics/ref/GATK.GRCh38/Annotation/intervals/wgs_calling_regions_noseconds.hg38.bed
aligner: bwa-mem
tools: haplotypecaller
skip_tools: haplotypecaller_filter
save_output_as_bam: true
save_mapped: true
