# sarek 3.10.0 parameters for the WGS chr20-slice reference runs (WGS mode). ${HOME} is expanded by run_sarek.sh.
input: samplesheet.csv
outdir: results
igenomes_ignore: true
fasta: ${HOME}/omics/ref/GATK.GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.fasta
fasta_fai: ${HOME}/omics/ref/GATK.GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.fasta.fai
dict: ${HOME}/omics/ref/GATK.GRCh38/Sequence/WholeGenomeFasta/Homo_sapiens_assembly38.dict
bwa: ${HOME}/omics/ref/GATK.GRCh38/Sequence/BWAIndex/
dbsnp: ${HOME}/omics/ref/GATK.GRCh38/Annotation/GATKBundle/dbsnp_146.hg38.vcf.gz
dbsnp_tbi: ${HOME}/omics/ref/GATK.GRCh38/Annotation/GATKBundle/dbsnp_146.hg38.vcf.gz.tbi
known_indels: ${HOME}/omics/ref/GATK.GRCh38/Annotation/GATKBundle/{Mills_and_1000G_gold_standard.indels.hg38,beta/Homo_sapiens_assembly38.known_indels}.vcf.gz
known_indels_tbi: ${HOME}/omics/ref/GATK.GRCh38/Annotation/GATKBundle/{Mills_and_1000G_gold_standard.indels.hg38,beta/Homo_sapiens_assembly38.known_indels}.vcf.gz.tbi
intervals: ${HOME}/omics/ref/GATK.GRCh38/Annotation/intervals/wgs_calling_regions_noseconds.hg38.bed
aligner: bwa-mem
tools: haplotypecaller
skip_tools: haplotypecaller_filter
save_output_as_bam: true
save_mapped: true
